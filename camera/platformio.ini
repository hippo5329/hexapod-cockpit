; hexacam: the miniHexa's camera board (ESP32-S3-CAM, N16R8, OV3660): MJPEG over Wi-Fi to the host's
; ROS bridge (ros/hexapod_bringup/scripts/camera_bridge.py). docs/camera.md.
;
;   pio run -d camera            build
;
; Build and flash are separate: never `pio run -t upload` (esptool, or OTA: firmware/tools/ota_upload.py).
[platformio]
default_envs = hexacam

[env:hexacam]
; The robot firmware's platform pin (firmware/platformio.ini).
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Two 6.25 MB app slots (OTA), nvs at 0x9000 (0x5000), as the camera tools write it.
board_build.partitions = default_16MB.csv
; N16R8: quad flash, octal PSRAM in the chip.
board_build.arduino.memory_type = qio_opi
; The robot firmware's syslog module (one copy: firmware/src/syslog.*).
build_src_filter = +<*> +<../../firmware/src/syslog.cpp>
build_flags =
    -I../firmware/src
    -DBOARD_HAS_PSRAM
    ; No console on the chip's USB-Serial/JTAG (Serial is UART0, GPIO 43/44; the log is syslog). The
    ; peripheral itself stays: esptool still flashes over USB. A USB console on the robot (no host)
    ; was a suspect in the Wi-Fi stalls (2026-11-06).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Wi-Fi and lwIP buffers in internal RAM (src/wifi_mem.h)
    -Wl,--wrap=heap_caps_malloc_prefer
    -Wl,--wrap=heap_caps_calloc_prefer
    -Wl,--wrap=heap_caps_realloc_prefer
