; hexacam: the miniHexa's camera board (ESP32-S3-CAM, N16R8, OV3660): MJPEG over Wi-Fi to the host's
; ROS bridge (ros/hexapod_bringup/scripts/camera_bridge.py). docs/camera.md.
;
;   pio run -d camera            build
;
; Build and flash are separate: never `pio run -t upload` (esptool, or OTA: firmware/tools/ota_upload.py).
[platformio]
default_envs = hexacam

[env:hexacam]
; The robot firmware's platform pin (firmware/platformio.ini).
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Two 6.25 MB app slots (OTA), nvs at 0x9000 (0x5000), as the camera tools write it.
board_build.partitions = default_16MB.csv
; N16R8: quad flash, octal PSRAM in the chip.
board_build.arduino.memory_type = qio_opi
; The robot firmware's syslog module (one copy: firmware/src/syslog.*).
build_src_filter = +<*> +<../../firmware/src/syslog.cpp>
build_flags =
    -I../firmware/src
    -DBOARD_HAS_PSRAM
    ; The UARTs' event task (onReceiveError callbacks) on 4 KB, as linorobot2-cockpit (platformio_base.ini):
    ; Arduino's 2048 overflowed with the LiDAR forwarder's UDP send in its callback (2026-11-07, stack canary
    ; in uart_event_task, a boot loop once LD19 data arrived).
    -DARDUINO_SERIAL_EVENT_TASK_STACK_SIZE=4096
    ; No console on the chip's USB-Serial/JTAG (Serial is UART0, GPIO 43/44; the log is syslog). The
    ; peripheral itself stays: esptool still flashes over USB. A USB console on the robot (no host)
    ; was a suspect in the Wi-Fi stalls (2026-11-06).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Wi-Fi and lwIP buffers in internal RAM (src/wifi_mem.h)
    -Wl,--wrap=heap_caps_malloc_prefer
    -Wl,--wrap=heap_caps_calloc_prefer
    -Wl,--wrap=heap_caps_realloc_prefer
    ; who holds the interrupts off: flash operations timed, NVS writes by caller (src/irq_watch.h)
    -Wl,--wrap=spi_flash_disable_interrupts_caches_and_other_cpu
    -Wl,--wrap=spi_flash_enable_interrupts_caches_and_other_cpu
    -Wl,--wrap=nvs_set_u8
    -Wl,--wrap=nvs_set_i8
    -Wl,--wrap=nvs_set_u16
    -Wl,--wrap=nvs_set_i16
    -Wl,--wrap=nvs_set_u32
    -Wl,--wrap=nvs_set_i32
    -Wl,--wrap=nvs_set_u64
    -Wl,--wrap=nvs_set_str
    -Wl,--wrap=nvs_set_blob
    -Wl,--wrap=nvs_erase_key
    -Wl,--wrap=nvs_erase_all
    -Wl,--wrap=nvs_commit
