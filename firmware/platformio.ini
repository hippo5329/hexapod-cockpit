; miniHexa firmware: one ESP32 binary per ROS 2 distro, plus native unit tests.
;
;   pio run -d firmware -e minihexa           build (jazzy)
;   pio run -d firmware -e minihexa_lyrical   build (lyrical: /cmd_vel is TwistStamped)
;   pio test -d firmware -e native            IK, gait and servo tests on the host
;
; Build and flash are separate: never `pio run -t upload`.

[platformio]
default_envs = minihexa

; Pins taken from linorobot2-cockpit's firmware: espressif32 8.0.0 (Arduino core 3.x)
; and the micro_ros_platformio fork commit that supports it. An unpinned platform or
; git dependency drifts under a cached build host.
[base_esp32]
platform = espressif32@8.0.0
; Classic ESP32 until the miniHexa board's chip is read (open question 1).
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 921600
board_microros_transport = serial
board_microros_user_meta = esp32.meta
lib_deps =
    https://github.com/hippo5329/micro_ros_platformio#f7ce5f7cf174b5751386678a8c7ca5a6a20f9266
build_flags =
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
test_ignore = *

[env:minihexa]
extends = base_esp32
board_microros_distro = jazzy

[env:minihexa_lyrical]
extends = base_esp32
board_microros_distro = lyrical
build_flags =
    ${base_esp32.build_flags}
    -DHEXA_CMD_VEL_STAMPED

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
