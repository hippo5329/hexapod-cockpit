# The miniHexa for linorobot2-cockpit's SLAM launcher (launchers/slam.launch.py config_file:=this).
# The slam block is cockpit's reference (makerspet_mini_config.yaml) with the hexapod's frame and pace:
# base_frame base_footprint (the top of this robot's tree: odom -> base_footprint -> base_link), travel
# thresholds 0.1 m / 0.15 rad (it walks ~0.03 m/s), LD19 range 8 m, the map every 2 s.
# The nav2 block is the reference's with the hexapod's: frames base_footprint, controller and smoother at
# 10 Hz (a 100 Hz /cmd_vel gave late gait ticks, 2026-11-06), MPPI Omni up to 0.20 m/s each way (the gait's top
# speed is 214 mm/s at its 0.4 s cycle; slower asks stretch the cycle) and 1.2 rad/s (the gait's top is 1.6),
# radius 0.17 m (frame 240 x 234 mm), inflation 0.45, progress 0.10 m in 30 s, goal yaw 0.25 rad.
# The slam block is flat (slam.launch.py wraps it): explore and nav2 read slam.base_frame from it.
# explore: min_frontier_size 0.3 (0.5, explore_lite's own, found 'no frontiers' in this furnished room after
# a partial map; cockpit's 0.2 sent this robot into a 0.2 m corner
# frontier, where the collision monitor's approach crept it at 0.003 m/s and explore_lite counted the creep
# as progress, 2026-11-07), progress_timeout 45 s.
robot:
  name: minihexa
  description: Hiwonder miniHexa (18-servo hexapod), ESP32 robot board + ESP32-S3
    camera board forwarding an LD19
base_controller:
  name: minihexa
  mcu: esp32
  sonar:
    i2c_address: 0x77  # Hiwonder's I2C ultrasonic: the collision monitor's sonar source needs it declared
  lidar:
    model: ld19
    comm_mode: udp
    udp_port: 8889
slam:
  solver_plugin: solver_plugins::CeresSolver
  ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
  ceres_preconditioner: SCHUR_JACOBI
  ceres_trust_strategy: LEVENBERG_MARQUARDT
  ceres_dogleg_type: TRADITIONAL_DOGLEG
  ceres_loss_function: None
  odom_frame: odom
  map_frame: map
  base_frame: base_footprint
  scan_topic: /scan
  mode: mapping
  debug_logging: false
  throttle_scans: 1
  transform_publish_period: 0.02
  restamp_tf: true
  map_update_interval: 2.0
  resolution: 0.05
  max_laser_range: 8.0
  minimum_time_interval: 0.5
  transform_timeout: 0.2
  tf_buffer_duration: 30.0
  stack_size_to_use: 40000000
  enable_interactive_mode: true
  use_scan_matching: true
  use_scan_barycenter: true
  minimum_travel_distance: 0.1
  minimum_travel_heading: 0.15
  check_min_dist_and_heading_precisely: true
  scan_buffer_size: 10
  scan_buffer_maximum_scan_distance: 8.0
  link_match_minimum_response_fine: 0.1
  link_scan_maximum_distance: 1.5
  loop_search_maximum_distance: 3.0
  do_loop_closing: true
  loop_match_minimum_chain_size: 10
  loop_match_maximum_variance_coarse: 3.0
  loop_match_minimum_response_coarse: 0.35
  loop_match_minimum_response_fine: 0.45
  correlation_search_space_dimension: 0.5
  correlation_search_space_resolution: 0.01
  correlation_search_space_smear_deviation: 0.1
  loop_search_space_dimension: 3.0
  loop_search_space_resolution: 0.05
  loop_search_space_smear_deviation: 0.03
  distance_variance_penalty: 0.5
  angle_variance_penalty: 1.0
  fine_search_angle_offset: 0.00349
  coarse_search_angle_offset: 0.349
  coarse_angle_resolution: 0.0349
  minimum_angle_penalty: 0.9
  minimum_distance_penalty: 0.5
  use_response_expansion: true
nav2:
  bt_navigator:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      odom_topic: /odom
      bt_loop_duration: 10
      default_server_timeout: 200
      wait_for_service_timeout: 30000
      action_server_result_timeout: 900.0
      # Back off instead of spinning when boxed in (minihexa_nav_to_pose_bt.xml, beside this file).
      default_nav_to_pose_bt_xml: minihexa_nav_to_pose_bt.xml
      navigators:
      - navigate_to_pose
      - navigate_through_poses
      navigate_to_pose:
        plugin: nav2_bt_navigator::NavigateToPoseNavigator
      navigate_through_poses:
        plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      error_code_names:
      - compute_path_error_code
      - follow_path_error_code
  controller_server:
    ros__parameters:
      enable_stamped_cmd_vel: false
      controller_frequency: 10.0
      costmap_update_timeout: 0.3
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins:
      - progress_checker
      goal_checker_plugins:
      - general_goal_checker
      controller_plugins:
      - FollowPath
      use_realtime_priority: false
      progress_checker:
        plugin: nav2_controller::PoseProgressChecker
        required_movement_radius: 0.1
        movement_time_allowance: 30.0
        required_movement_angle: 0.5
      general_goal_checker:
        stateful: true
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.15
        yaw_goal_tolerance: 0.25
      FollowPath:
        # The hexapod walks in any direction: MPPI with the Omni model (vx, vy, wz), so it can back off and side-step
        # a wall instead of turning in place on the spot (the rotation shim + pure pursuit, a diff-drive pair, stood
        # at walls: the collision monitor scaled the in-place turn to nothing and reversing was off).
        plugin: nav2_mppi_controller::MPPIController
        motion_model: Omni
        # 2.5 s of horizon (25 cm at 0.10 m/s), noise 0.03 and the goal critics only in the last 0.2 m: with 4 s,
        # 0.02 and 0.5 m it drove 12 cm goals at 0.011-0.013 m/s (a full-speed rollout overshot the goal).
        time_steps: 25
        model_dt: 0.1
        batch_size: 600  # 1000 ran the controller at 7-8 Hz of its 10
        iteration_count: 1
        vx_std: 0.05
        vy_std: 0.05
        wz_std: 0.4
        vx_max: 0.20
        vx_min: -0.20
        vy_max: 0.20
        # The gait's top turn: the stride limit at a foot (214 mm/s at the 0.4 s cycle) on the outermost foot, 0.134 m
        # out: 1.6 rad/s (sim/tools/turn_rate_sim). 1.2 keeps the gait off its clamp.
        wz_max: 1.2
        ax_max: 0.2
        ax_min: -0.2
        ay_max: 0.2
        # ay_min defaults to -3.0: each rollout's vy then grew at most 0.01 per step but fell 0.3, the clamped noise
        # averaged toward zero and a side-step ran at 0.011 m/s (|vy| <= 0.029, vx reached 0.055). Symmetric, as ax.
        ay_min: -0.2
        az_max: 1.0
        # Scaled to the robot: gamma / std^2 is the control cost's weight, 0.015 / 0.03^2 = 17 (44x the reference's
        # 0.015 / 0.2^2) held every command near zero (0.011-0.020 m/s, |vy| <= 0.006); now 0.00125 / 0.05^2 = 0.5. Rollouts
        # 2.5 s long end centimetres apart, so the critics' costs differ by tenths: temperature 0.05, not 0.3.
        temperature: 0.05
        gamma: 0.00125
        prune_distance: 1.0
        transform_tolerance: 0.3
        enforce_path_inversion: false
        regenerate_noises: true
        visualize: false
        critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        - TwirlingCritic
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 4.0
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.81
          critical_cost: 300.0
          consider_footprint: false
          collision_cost: 1000000.0
          near_goal_distance: 0.5
          trajectory_point_step: 2
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 0.2
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.2
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 14.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 4
          threshold_to_consider: 0.2
          offset_from_furthest: 20
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 0.2
        # Head forward: the camera looks ahead, so the robot faces where it goes (user, 2026-11-08). The omni model
        # keeps vy and reverse for corrections and for backing off; these make facing the path the cheap way.
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 2.0
          offset_from_furthest: 4
          threshold_to_consider: 0.3
          max_angle_to_furthest: 0.6
          mode: 0
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 0.3
        TwirlingCritic:
          enabled: true
          cost_power: 1
          cost_weight: 10.0
  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins:
      - GridBased
      costmap_update_timeout: 1.0
      GridBased:
        plugin: nav2_navfn_planner::NavfnPlanner
        tolerance: 0.5
        use_astar: false
        allow_unknown: true
  smoother_server:
    ros__parameters:
      smoother_plugins:
      - simple_smoother
      simple_smoother:
        plugin: nav2_smoother::SimpleSmoother
        tolerance: 1.0e-10
        max_its: 1000
        do_refinement: true
  behavior_server:
    ros__parameters:
      enable_stamped_cmd_vel: false
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait
      spin:
        plugin: nav2_behaviors::Spin
      backup:
        plugin: nav2_behaviors::BackUp
      drive_on_heading:
        plugin: nav2_behaviors::DriveOnHeading
      wait:
        plugin: nav2_behaviors::Wait
      local_frame: odom
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.2
      min_rotational_vel: 0.15
      rotational_acc_lim: 3.72
  velocity_smoother:
    ros__parameters:
      enable_stamped_cmd_vel: false
      smoothing_frequency: 10.0
      scale_velocities: false
      feedback: OPEN_LOOP
      max_velocity:
      - 0.20
      - 0.20
      - 1.2
      min_velocity:
      - -0.20
      - -0.20
      - -1.2
      max_accel:
      - 0.2
      - 0.2
      - 1.0
      max_decel:
      - -0.2
      - -0.2
      - -1.0
      odom_topic: odom
      odom_duration: 0.1
      deadband_velocity:
      - 0.0
      - 0.0
      - 0.0
      velocity_timeout: 1.0
  collision_monitor:
    ros__parameters:
      enable_stamped_cmd_vel: false
      base_frame_id: base_footprint
      odom_frame_id: odom
      cmd_vel_in_topic: cmd_vel_smoothed
      cmd_vel_out_topic: cmd_vel
      state_topic: collision_monitor_state
      transform_tolerance: 0.2
      source_timeout: 1.0
      base_shift_correction: false
      stop_pub_timeout: 2.0
      polygons:
      - FootprintApproach
      FootprintApproach:
        type: polygon
        action_type: approach
        footprint_topic: /local_costmap/published_footprint
        time_before_collision: 1.2
        simulation_time_step: 0.1
        min_points: 6
        visualize: false
        enabled: true
      observation_sources:
      - scan
      - sonar
      scan:
        type: scan
        topic: scan
        min_height: 0.15
        max_height: 2.0
        enabled: true
      sonar:
        # The front ultrasonic: what is near ahead below the LiDAR's plane slows and stops the robot; it is no
        # costmap layer. Its beam is ~30 deg (the message says 15): an echo off a chair 10-15 deg aside read
        # 1.42 m with the LiDAR clear to 2.72 m ahead, and the RangeSensorLayer marked every such echo as an
        # arc across the cone, never cleared, until turning in place stacked them into rings and Nav2 refused
        # the survey's turns (2026-11-08).
        type: range
        topic: sonar
        obstacles_angle: 0.0349  # 2 deg between the arc's points
        enabled: true
  docking_server:
    ros__parameters:
      enable_stamped_cmd_vel: false
      controller_frequency: 20.0
      initial_perception_timeout: 5.0
      wait_charge_timeout: 5.0
      dock_approach_timeout: 30.0
      undock_linear_tolerance: 0.05
      undock_angular_tolerance: 0.1
      max_retries: 3
      base_frame: base_footprint
      fixed_frame: odom
      dock_backwards: false
      dock_prestaging_tolerance: 0.5
      dock_plugins:
      - simple_charging_dock
      simple_charging_dock:
        plugin: opennav_docking::SimpleChargingDock
        docking_threshold: 0.05
        staging_x_offset: -0.7
        use_external_detection_pose: true
        use_battery_status: false
        use_stall_detection: false
  waypoint_follower:
    ros__parameters:
      loop_rate: 20
      stop_on_failure: false
      action_server_result_timeout: 900.0
      waypoint_task_executor_plugin: wait_at_waypoint
      wait_at_waypoint:
        plugin: nav2_waypoint_follower::WaitAtWaypoint
        enabled: true
        waypoint_pause_duration: 200
  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_footprint
        transform_tolerance: 0.5
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.17
        plugins:
        - voxel_layer
        - camera_layer
        - inflation_layer
        camera_layer:
          # camera_vision's camera/obstacle_scan: what stands over 4.5 cm off the floor ahead, below the LiDAR's
          # plane (a slipper). A layer of its own: in one layer the LiDAR's rays over it would clear it.
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: camera
          camera:
            topic: /camera/obstacle_scan
            data_type: LaserScan
            marking: true
            clearing: true
            inf_is_valid: true
            min_obstacle_height: -0.10
            max_obstacle_height: 0.50
            obstacle_max_range: 1.0  # camera_vision scan_range: past it the floor fit cannot tell 4.5 cm
            raytrace_max_range: 1.0
            raytrace_min_range: 0.30
            expected_update_rate: 0.0
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          # 10, not 3: in a 0.8 m doorway the cost at its middle was half lethal and MPPI crawled at ~0.01 m/s
          # (2026-11-08); it now falls to a tenth by 0.4 m from a wall.
          cost_scaling_factor: 10.0
          inflation_radius: 0.45
        voxel_layer:
          plugin: nav2_costmap_2d::VoxelLayer
          enabled: true
          publish_voxel_map: true
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          observation_sources: scan
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        always_send_full_costmap: true
  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_footprint
        transform_tolerance: 1.0
        robot_radius: 0.17
        resolution: 0.05
        track_unknown_space: true
        plugins:
        - static_layer
        - obstacle_layer
        # No camera_layer here: monocular depth is for what is near (a slipper ahead); its far-floor
        # errors in the global costmap fenced off every frontier after a look-around (2026-11-08). The
        # local costmap carries it; the LiDAR builds this one.
        # No sonar layer in either costmap: the collision monitor takes the sonar (its comment). Here a
        # RangeSensorLayer that could not transform into `map` (Nav2 up before SLAM) also blocked the update
        # for transform_tolerance on every reading, and the costmap stopped publishing (2026-11-08).
        - inflation_layer
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          # 10, not 3: in a 0.8 m doorway the cost at its middle was half lethal and MPPI crawled at ~0.01 m/s
          # (2026-11-08); it now falls to a tenth by 0.4 m from a wall.
          cost_scaling_factor: 10.0
          inflation_radius: 0.45
        always_send_full_costmap: true
explore:
  ros__parameters:
    progress_timeout: 45.0
    min_frontier_size: 0.3
