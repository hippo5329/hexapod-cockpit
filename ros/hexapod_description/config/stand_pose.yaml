      rm_femur: 0.297447
      rm_tibia: -1.772154
      rr_coxa: 0.0
      rr_femur: 0.297447
      rr_tibia: -1.772154
      lr_coxa: 0.0
      lr_femur: 0.297447
      lr_tibia: -1.772154
      lm_coxa: 0.0
      lm_femur: 0.297447
      lm_tibia: -1.772154
      lf_coxa: 0.0
      lf_femur: 0.297447
      lf_tibia: -1.772154
