# Standing pose: the firmware gait's neutral stance (hexa_kin neutral_foot), every leg
# alike. joint_state_publisher holds these for source:=stand. test_urdf_fk.py checks that
# they put each foot on neutral_foot; recompute them when the geometry changes.
